<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />

  <!-- Graduation Mortarboard Cap Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cap top diamond -->
    <polygon points="32,16 52,25 32,34 12,25" />
    <!-- Skull cap skull base -->
    <path d="M20,29.5 L20,38 C20,43 44,43 44,38 L44,29.5 L32,35 Z" fill="#ffffff" opacity="0.9" />
    <!-- Tassel string and pendant -->
    <path d="M46,27.5 L49,36 L51,36 L51,39 L47,39 L47,36 L49,36 L46.5,28" fill="#fbbf24" stroke="#fbbf24" stroke-width="0.5" />
  </g>
</svg>
